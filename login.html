<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AI Heritage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="app-config.js"></script>
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem 3rem;
            background:
                radial-gradient(800px 400px at 85% 10%, rgba(74, 124, 140, 0.12), transparent 60%),
                radial-gradient(700px 400px at 10% 90%, rgba(212, 175, 55, 0.08), transparent 55%),
                linear-gradient(135deg, #fafaf8 0%, #eef2f4 100%);
        }

        .auth-container {
            background: #fff;
            border-radius: 24px;
            padding: 3rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 2px 4px rgba(26, 46, 63, 0.05), 0 32px 64px -16px rgba(26, 46, 63, 0.25);
            border: 1px solid rgba(26, 46, 63, 0.07);
            animation: fadeInUp 0.6s ease;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-header .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a2e3f;
            text-decoration: none;
            margin-bottom: 0.5rem;
        }

        .auth-header h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
        }

        .auth-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e8edf0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a2e3f;
        }

        .form-group .input-icon {
            position: relative;
        }

        .form-group .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .form-group .input-icon input {
            padding-left: 40px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #555;
            cursor: pointer;
        }

        .form-options a {
            color: #1a2e3f;
            text-decoration: none;
            font-weight: 600;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-auth {
            width: 100%;
            padding: 0.9rem;
            background: #1a2e3f;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-auth:hover {
            background: #2c4a5f;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(26, 46, 63, 0.2);
        }

        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: #1a2e3f;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s ease;
        }

        .back-home:hover {
            color: #1a2e3f;
        }

        .social-login {
            margin-top: 1.5rem;
            text-align: center;
        }

        .social-login p {
            color: #999;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .social-login p::before,
        .social-login p::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: #e8edf0;
        }

        .social-login p::before {
            left: 0;
        }

        .social-login p::after {
            right: 0;
        }

        .social-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #e8edf0;
            background: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn:hover {
            border-color: rgba(74, 124, 140, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 46, 63, 0.12);
        }

        .alert {
            padding: 0.8rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .alert.error {
            display: block;
            background: #fee;
            color: #dc3545;
            border: 1px solid #fcc;
        }

        .alert.success {
            display: block;
            background: #efe;
            color: #28a745;
            border: 1px solid #cfc;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 2rem 1.5rem;
            }
            .auth-header h2 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <a href="profile.html" title="Profile" style="position:fixed; top:1.5rem; right:1.5rem; z-index:1000; width:36px; height:36px; border-radius:50%; background:#1a2e3f; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; text-decoration:none;">T</a>

    <section class="auth-page">
        <div class="auth-container">
            <a href="index.html" class="back-home">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <div class="auth-header">
                <a href="index.html" class="logo">
                    <span class="logo-mark"><i class="fas fa-landmark"></i></span>
                    <span class="logo-text"><span class="logo-ai">AI</span>Heritage</span>
                </a>
                <h2>Welcome Back</h2>
                <p>Login to your account to continue</p>
            </div>

            <div id="alertMessage" class="alert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="you@example.com" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required />
                    </div>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" id="rememberMe" /> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn-auth" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="social-login">
                <p>Or continue with</p>
                <div class="social-buttons">
                    <a href="/auth/google" class="social-btn">
                        <i class="fab fa-google" style="color:#DB4437;"></i>
                    </a>
                    <a href="/auth/github" class="social-btn">
                        <i class="fab fa-github" style="color:#333;"></i>
                    </a>
                </div>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </section>

    <script>
        // ---------- HANDLE LOGIN ----------
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const alertEl = document.getElementById('alertMessage');
            const loginBtn = document.getElementById('loginBtn');

            // Validate
            if (!email || !password) {
                alertEl.className = 'alert error';
                alertEl.textContent = '\u26A0\uFE0F Please fill in all fields';
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                alertEl.className = 'alert error';
                alertEl.textContent = '\u26A0\uFE0F Please enter a valid email address';
                return;
            }

            if (password.length < 6) {
                alertEl.className = 'alert error';
                alertEl.textContent = '\u26A0\uFE0F Password must be at least 6 characters';
                return;
            }

            // Show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

            fetch(apiUrl('/api/login'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password, rememberMe: rememberMe })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const session = {
                        user: data.user,
                        token: data.token,
                        loginTime: new Date().toISOString(),
                        rememberMe: rememberMe
                    };
                    if (rememberMe) {
                        localStorage.setItem('aiHeritageSession', JSON.stringify(session));
                    } else {
                        sessionStorage.setItem('aiHeritageSession', JSON.stringify(session));
                    }
                    alertEl.className = 'alert success';
                    alertEl.textContent = 'Login successful! Redirecting...';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    alertEl.className = 'alert error';
                    alertEl.textContent = data.error || 'Login failed. Please try again.';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                }
            })
            .catch(() => {
                alertEl.className = 'alert error';
                alertEl.textContent = 'Cannot connect to the API at ' + apiUrl('/api/login') + '. Run "npm start" in the project folder.';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            });
        }
        // ---------- CHECK EXISTING SESSION ----------
        document.addEventListener('DOMContentLoaded', () => {
            const session = getAiHeritageSession();
            
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });

        console.log('\u2705 Login page loaded');
    </script>
</body>
</html>
